<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guru BYD - Assistente AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="video-bg">
    <!-- Efeito escuro suave e radial para imitar profundidade -->
  </div>
  
  <div class="app-container">
    <header class="chat-header">
      <div class="logo">
        <h1>Guru <span>BYD</span></h1>
      </div>
      <p class="subtitle">Seu Assistente Técnico de Bolso</p>
    </header>

    <main class="chat-area" id="chatArea">
      <div class="message ai-message">
        <div class="avatar">AI</div>
        <div class="bubble">
          Olá, Júnio! Me pergunte qualquer coisa sobre os carros da BYD. Terei prazer em checar nos manuais. 🚗
        </div>
      </div>
    </main>

    <footer class="input-area">
      <form id="chatForm">
        <input type="text" id="userInput" placeholder="O que significa a luz laranja?" autocomplete="off" required>
        <button type="submit" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
